<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
        <tr>
          <td style="height:6px;background-color:#6366f1;background-image:linear-gradient(90deg,#7c6cf0,#22d3ee);font-size:0;line-height:6px;">&nbsp;</td>
        </tr>
        <tr>
          <td style="padding:36px 40px 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto;">
              <tr>
                <td width="40" style="width:40px;height:40px;background-color:#6366f1;background-image:linear-gradient(135deg,#7c6cf0,#22d3ee);border-radius:10px;text-align:center;vertical-align:middle;color:#ffffff;font-size:20px;font-weight:700;">C</td>
                <td style="padding-left:12px;font-size:22px;font-weight:700;color:#0f172a;">ClearSight</td>
              </tr>
            </table>
            <h1 style="margin:28px 0 0;text-align:center;font-size:26px;font-weight:700;color:#0f172a;">Your sign-in code</h1>
            <p style="margin:10px 0 0;text-align:center;font-size:15px;color:#64748b;">Enter this code to finish signing in.</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:28px 0 0;">
              <tr>
                <td style="background-color:#f5f3ff;border:1px solid #ede9fe;border-radius:14px;padding:22px 0;text-align:center;font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:12px;color:#5b21b6;">{{ .Token }}</td>
              </tr>
            </table>
            <p style="margin:14px 0 0;text-align:center;font-size:13px;color:#94a3b8;">This code expires in 1 hour.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:26px auto 0;">
              <tr>
                <td style="border-radius:12px;background-color:#6366f1;background-image:linear-gradient(135deg,#7c6cf0,#22d3ee);">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 28px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">Sign in to ClearSight</a>
                </td>
              </tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:32px 0 0;">
              <tr><td style="border-top:1px solid #e2e8f0;font-size:0;line-height:0;">&nbsp;</td></tr>
            </table>
            <p style="margin:20px 0 0;text-align:center;font-size:13px;line-height:1.6;color:#94a3b8;">Didn&rsquo;t request this code? You can safely ignore this email &mdash; no one can access your account without it.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
